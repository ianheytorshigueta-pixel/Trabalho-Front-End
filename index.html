<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  
  <title>Card de Resumo do Pedido</title>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <main>

    <div class="bloco">
      <img class="ilustracao" src="/images/illustration-hero.svg" alt="">
      <h1>Order Summary</h1>
      <p id="descricao">You can now listen to million of songs, audiobooks, and podcasts on any device anywhere you like</p>

      <div class="bloco-menor">
        <img src="/images/icon-music.svg" alt="">
        <p>Annual Plan</p>
        <p style="color: #8d94a6;">$59.99/year</p>
        <a href="">Change</a>
      </div>

      <div class="botoes">
        <button id="button-payment">Proceed to Payment</button>
        <button id="cancel">Cancel Order</button>
      </div>
      
    </div>

  </main>

</body>
</html>
